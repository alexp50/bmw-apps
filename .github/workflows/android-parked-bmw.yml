name: Build Parked BMW Android app

on:
  push:
    paths:
      - "android/parked-bmw/**"
      - ".github/workflows/android-parked-bmw.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore persistent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parked-bmw-signing.p12"
      - name: Build signed APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/parked-bmw-signing.p12
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle -p android/parked-bmw :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Parked-BMW-0.5.0
          path: android/parked-bmw/app/build/outputs/apk/release/app-release.apk
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/parked-bmw/app/build/outputs/apk/release/app-release.apk Parked-BMW-0.5.0.apk
          if gh release view 'parked-bmw-android@0.5.0' >/dev/null 2>&1; then
            gh release upload 'parked-bmw-android@0.5.0' Parked-BMW-0.5.0.apk --clobber
          else
            gh release create 'parked-bmw-android@0.5.0' Parked-BMW-0.5.0.apk \
              --title 'Parked BMW for Android 0.5.0' \
              --notes 'Adds BMW Assistant warm-up estimates, live and recent trips, vehicle health, service status, and bridge/provider diagnostics.' \
              --latest=false
          fi
